name: alpine/musl

on: [push, pull_request]

permissions:
  contents: read

jobs:
  musl:
      name: gcc
      runs-on: ubuntu-latest
      container:
        image: alpine:latest
      steps:
      - uses: actions/checkout@v1
        with:
          submodules: true
      - name: Install dependencies
        run: apk add binutils --no-cache build-base readline-dev openssl-dev ncurses-dev git cmake zlib-dev libsodium-dev gnu-libiconv 
      - name: Configure
        run: ./configure
      - name: make 
        run: make -C build
      - name: Upload musl binaries as artifacts
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: musl-binaries
          path: |
            build/vpnserver
            build/vpncmd
            build/vpnclient
            build/vpnbridge
            build/hamcore.se2